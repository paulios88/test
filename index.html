<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <header>
      <h1>Habits</h1>
      <p class="date" id="today"></p>
      <p class="summary" id="summary"></p>
    </header>

    <section class="presets">
      <h2>Vorschläge</h2>
      <div id="preset-list" class="preset-list"></div>
    </section>

    <section class="add-section">
      <h2>Eigene Gewohnheit</h2>
      <form id="add-form">
        <input type="text" id="habit-input" placeholder="z. B. Gitarre üben" maxlength="40" required>
        <select id="category-select"></select>
        <button type="submit" id="add-button" aria-label="Hinzufügen"></button>
      </form>
    </section>

    <ul id="habit-list"></ul>

    <p id="empty-state" class="empty">Noch keine Gewohnheiten. Leg los!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
