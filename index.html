<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <header>
      <h1>Habits</h1>
      <p class="date" id="today"></p>
    </header>

    <form id="add-form">
      <input type="text" id="habit-input" placeholder="Neue Gewohnheit..." maxlength="40" required>
      <button type="submit">+</button>
    </form>

    <ul id="habit-list"></ul>

    <p id="empty-state" class="empty">Noch keine Gewohnheiten. Leg los!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
